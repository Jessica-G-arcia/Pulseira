<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .card-reset { width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); background: white; padding: 30px; }
        .btn-reset { width: 100%; padding: 12px; background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); border: none; border-radius: 10px; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card-reset">
        <h4 class="text-center fw-bold mb-3">Recuperar Senha</h4>
        <p class="text-muted small text-center mb-4">Insira seu e-mail cadastrado e enviaremos um link para criar uma nova senha.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Seu e-mail" required>
            </div>
            <button type="submit" class="btn-reset">ENVIAR LINK</button>
        </form>
    </div>
</body>
</html>
