<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #e9ecef; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
        }

        .card-reset { 
            width: 100%; 
            max-width: 450px; 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); 
            background: white; 
            overflow: hidden; 
        }

        /* Cabeçalho com o Gradiente Padrão */
        .card-header { 
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); 
            padding: 30px; 
            text-align: center; 
            color: white; 
        }
        .card-header h3 { margin: 0; font-weight: 700; }

        .card-body { padding: 30px; }

        /* Estilização dos campos gerados pelo {{ form.as_p }} */
        form p {
            margin-bottom: 20px;
        }
        
        form label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
            display: block;
        }

        /* Força os inputs do Django a ficarem iguais aos do Login */
        form input {
            width: 100%;
            height: 48px;
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: 0.3s;
        }

        form input:focus {
            border-color: #DD2476;
            outline: none;
            box-shadow: 0 0 0 3px rgba(221, 36, 118, 0.1);
        }

        /* Texto de ajuda (ex: "Sua senha deve ter 8 caracteres...") */
        .helptext {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
            line-height: 1.4;
        }

        /* Botão com Gradiente */
        .btn-reset { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); 
            border: none; 
            border-radius: 10px; 
            color: white; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-reset:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        /* Lista de erros do Django (se a senha for fraca) */
        ul.errorlist {
            list-style: none;
            padding: 0;
            color: #dc3545;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card-reset">
        <div class="card-header">
            <h3>Definir Nova Senha</h3>
        </div>
        
        <div class="card-body">
            <p class="text-muted text-center mb-4 small">
                Crie uma senha forte para proteger sua conta.
            </p>

            <form method="post">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <button type="submit" class="btn-reset">SALVAR NOVA SENHA</button>
            </form>
        </div>
    </div>

</body>
</html>
