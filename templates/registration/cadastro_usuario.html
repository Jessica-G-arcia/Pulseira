<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua Conta SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .card-cadastro { width: 100%; max-width: 550px; border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); background: white; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); padding: 30px; text-align: center; color: white; }
        .form-group { margin-bottom: 15px; }
        .btn-cadastrar { width: 100%; padding: 14px; background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); border: none; border-radius: 10px; color: white; font-weight: bold; margin-top: 15px; }
        input[readonly] { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="card-cadastro">
        <div class="card-header">
            <h3>Criar Conta SOS</h3>
            <p>Seus dados de responsável</p>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label class="form-label fw-bold small">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <small class="text-danger">{% for error in field.errors %}{{ error }}{% endfor %}</small>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn-cadastrar">CRIAR MINHA CONTA</button>
            </form>
            <div class="text-center mt-3">
                <small>Já tem conta? <a href="{% url 'login' %}" style="color:#DD2476; font-weight:bold; text-decoration:none;">Fazer Login</a></small>
            </div>
        </div>
    </div>

    

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const inputCPF = document.querySelector('input[name="cpf"]');
            const inputCEP = document.querySelector('input[name="cep"]');
            const inputRua = document.querySelector('input[name="logradouro"]');
            const inputNum = document.querySelector('input[name="numero"]');
            const inputBairro = document.querySelector('input[name="bairro_cidade"]');

            if (inputCPF) {
                inputCPF.addEventListener('input', e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 9) v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
                    else if (v.length > 6) v = v.replace(/^(\d{3})(\d{3})(\d{3})/, "$1.$2.$3");
                    else if (v.length > 3) v = v.replace(/^(\d{3})(\d{3})/, "$1.$2");
                    e.target.value = v;
                });
            }

            if (inputCEP) {
                inputCEP.addEventListener('input', e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 8);
                    if (v.length > 5) v = v.replace(/^(\d{5})(\d)/, "$1-$2");
                    e.target.value = v;
                });
                inputCEP.addEventListener('blur', function() {
                    let cep = this.value.replace(/\D/g, "");
                    if (cep.length === 8) {
                        inputRua.value = "Buscando...";
                        fetch(`https://viacep.com.br/ws/${cep}/json/`)
                            .then(r => r.json())
                            .then(data => {
                                if (!data.erro) {
                                    inputRua.value = data.logradouro;
                                    inputBairro.value = `${data.bairro} - ${data.localidade}/${data.uf}`;
                                    inputNum.focus();
                                }
                            });
                    }
                });
            }
        });
    </script>
</body>
</html>
