<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Enviado - SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .card-confirmacao { width: 100%; max-width: 500px; border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); background: white; overflow: hidden; text-align: center; padding: 40px; }
        .icon-check { font-size: 50px; color: #28a745; margin-bottom: 20px; }
        h3 { color: #DD2476; font-weight: 700; }
        .btn-voltar { background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); border: none; color: white; font-weight: bold; padding: 10px 30px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card-confirmacao">
        <div class="icon-check">📧</div>
        <h3>E-mail enviado!</h3>
        <p class="text-muted mt-3">
            Enviamos as instruções para redefinir sua senha para o endereço de e-mail informado. 
            Verifique também sua caixa de <strong>spam</strong>.
        </p>
        <p class="small text-secondary">Se o e-mail não chegar em alguns minutos, verifique se digitou o endereço corretamente.</p>
        <a href="{% url 'login' %}" class="btn-voltar">VOLTAR AO LOGIN</a>
    </div>
</body>
</html>
