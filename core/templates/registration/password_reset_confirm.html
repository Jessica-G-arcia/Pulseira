<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-reset { width: 100%; max-width: 400px; border-radius: 20px; background: white; padding: 30px; }
        .btn-reset { width: 100%; padding: 12px; background: #DD2476; border: none; border-radius: 10px; color: white; font-weight: bold; }
        .form-control { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card-reset">
        <h4 class="fw-bold mb-3">Nova Senha</h4>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }} <button type="submit" class="btn-reset">SALVAR NOVA SENHA</button>
        </form>
    </div>
</body>
</html>
