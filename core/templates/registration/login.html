<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card-login {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            background: white;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 12px;
            cursor: pointer;
            color: #888;
            z-index: 10;
        }

        .btn-entrar {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            margin-top: 10px;
        }

        .links a {
            color: #DD2476;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card-login">
        <div class="card-header">
            <h3>Acesse sua conta</h3>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small">Usuário</label>
                    {{ form.username }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small">Senha</label>
                    <div class="password-container">
                        {{ form.password }}
                        <i class="bi bi-eye toggle-password" id="eyeIcon"></i>
                    </div>
                </div>
                <div class="text-end mb-3">
                    <a href="{% url 'reset_password' %}" class="small text-muted" style="text-decoration:none;">Esqueceu
                        a senha?</a>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger p-2 small text-center">Usuário ou senha inválidos.</div>
                {% endif %}

                <button type="submit" class="btn-entrar">ENTRAR NO SISTEMA</button>
            </form>
            <div class="text-center mt-4">
                <small>Não tem uma conta? <a href="{% url 'cadastro_usuario' %}">Cadastre-se</a></small>
            </div>
        </div>
    </div>

    <script>
        const eyeIcon = document.getElementById('eyeIcon');
        // Seleciona o campo de senha (no Django ele vem com o type="password")
        const passwordField = document.querySelector('input[type="password"]');

        eyeIcon.addEventListener('click', function () {
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });
    </script>
</body>

</html>
