<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card-login {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            background: white;
            margin: 10px;
        }
        .card-header {
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
            padding: 30px;
            text-align: center;
            border: none;
        }
        .card-header h3 { color: white; margin: 0; font-weight: 700; }
        .card-body { padding: 40px; }
        
        /* Inputs Estilizados */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
            background-color: #f8f9fa;
        }
        input:focus {
            border-color: #DD2476;
            background-color: white;
            outline: none;
        }
        .btn-entrar {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-entrar:hover { opacity: 0.9; transform: translateY(-1px); }
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #DD2476; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card-login">
        <div class="card-header">
            <h3>Bem-vindo</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <label style="font-weight:600; color:#555; margin-bottom:5px;">Usuário</label>
                {{ form.username }}
                
                <label style="font-weight:600; color:#555; margin-bottom:5px;">Senha</label>
                {{ form.password }}

                {% if form.errors %}
                <div class="alert alert-danger p-2 small">Usuário ou senha incorretos.</div>
                {% endif %}

                <button type="submit" class="btn-entrar">ENTRAR</button>
            </form>
            <div class="links">
                Não tem conta? <a href="{% url 'cadastro_usuario' %}">Criar conta grátis</a>
            </div>
        </div>
    </div>
</body>
</html>
