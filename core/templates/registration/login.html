<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #e9ecef; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
        }
        .card-login { 
            width: 100%; 
            max-width: 400px; 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); 
            background: white; 
            overflow: hidden; 
        }
        .card-header { 
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); 
            padding: 30px; 
            text-align: center; 
            color: white; 
        }
        .card-header h3 { margin: 0; font-weight: 700; }

        /* Estilização Identica para Inputs */
        .form-control {
            height: 50px !important;
            border-radius: 10px !important;
            border: 2px solid #e9ecef !important;
            padding: 10px 15px !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }
        .form-control:focus {
            border-color: #DD2476 !important;
            box-shadow: none !important;
        }

        /* Container da Senha */
        .password-group {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #888;
            font-size: 1.2rem;
            z-index: 10;
            display: flex;
            align-items: center;
            height: 100%;
        }

        .btn-entrar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-entrar:hover { opacity: 0.9; transform: translateY(-1px); }
        .links a { color: #DD2476; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card-login">
        <div class="card-header">
            <h3>Acesse sua conta</h3>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">Usuário</label>
                    {{ form.username }}
                </div>
                
                <div class="mb-2">
                    <label class="form-label fw-bold small text-secondary">Senha</label>
                    <div class="password-group">
                        {{ form.password }}
                        <div class="toggle-password">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </div>
                    </div>
                </div>

                <div class="text-end mb-4">
                    <a href="{% url 'reset_password' %}" class="small text-muted" style="text-decoration:none;">Esqueceu a senha?</a>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger p-2 small text-center border-0" style="background-color: #f8d7da; color: #842029; border-radius: 10px;">
                    Usuário ou senha inválidos.
                </div>
                {% endif %}

                <button type="submit" class="btn-entrar">ENTRAR NO SISTEMA</button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Não tem uma conta? <a href="{% url 'cadastro_usuario' %}">Cadastre-se</a></small>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const eyeIcon = document.getElementById('eyeIcon');
            // Busca o input de senha que o Django renderizou
            const passwordField = document.querySelector('input[type="password"]');

            if (eyeIcon && passwordField) {
                eyeIcon.parentElement.addEventListener('click', function () {
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    
                    eyeIcon.classList.toggle('bi-eye');
                    eyeIcon.classList.toggle('bi-eye-slash');
                });
            }
        });
    </script>
</body>
</html>
