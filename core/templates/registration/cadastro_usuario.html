<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua Conta SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .card-cadastro { width: 100%; max-width: 550px; border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; background: white; }
        .card-header { background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); padding: 30px; text-align: center; border: none; color: white; }
        .card-body { padding: 40px; }
        .form-group { margin-bottom: 18px; }
        .form-label { font-weight: 600; color: #495057; font-size: 14px; margin-bottom: 5px; display: block; }
        input.form-control { border-radius: 10px; padding: 10px 15px; border: 2px solid #eee; }
        input.form-control:focus { border-color: #DD2476; box-shadow: none; }
        input[readonly] { background-color: #f8f9fa; cursor: not-allowed; }
        .btn-cadastrar { width: 100%; padding: 14px; background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); border: none; border-radius: 10px; color: white; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn-cadastrar:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(221, 36, 118, 0.3); }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .login-link a { color: #DD2476; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card-cadastro">
        <div class="card-header">
            <h3>Criar Conta SOS</h3>
            <p>Seus dados de responsável</p>
        </div>
        
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <small class="text-danger">{% for error in field.errors %}{{ error }}{% endfor %}</small>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn-cadastrar">CRIAR MINHA CONTA</button>
            </form>

            <div class="login-link">
                Já tem conta? <a href="{% url 'login' %}">Fazer Login</a>
            </div>
        </div>
    </div>

    

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Seletores baseados nos nomes dos campos do Django
            const inputCPF = document.querySelector('input[name="cpf"]');
            const inputCEP = document.querySelector('input[name="cep"]');
            const inputRua = document.querySelector('input[name="logradouro"]');
            const inputNum = document.querySelector('input[name="numero"]');
            const inputBairro = document.querySelector('input[name="bairro_cidade"]');

            // Máscara de CPF
            if (inputCPF) {
                inputCPF.addEventListener('input', e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 9) v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
                    else if (v.length > 6) v = v.replace(/^(\d{3})(\d{3})(\d{3})/, "$1.$2.$3");
                    else if (v.length > 3) v = v.replace(/^(\d{3})(\d{3})/, "$1.$2");
                    e.target.value = v;
                });
            }

            // Máscara e Busca de CEP
            if (inputCEP) {
                inputCEP.addEventListener('input', e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 8);
                    if (v.length > 5) v = v.replace(/^(\d{5})(\d)/, "$1-$2");
                    e.target.value = v;
                });

                inputCEP.addEventListener('blur', function() {
                    let cep = this.value.replace(/\D/g, "");
                    if (cep.length === 8) {
                        inputRua.value = "Buscando...";
                        fetch(`https://viacep.com.br/ws/${cep}/json/`)
                            .then(r => r.json())
                            .then(data => {
                                if (!data.erro) {
                                    inputRua.value = data.logradouro;
                                    inputBairro.value = `${data.bairro} - ${data.localidade}/${data.uf}`;
                                    inputNum.focus();
                                } else {
                                    alert("CEP não encontrado.");
                                    inputRua.value = "";
                                }
                            });
                    }
                });
            }
        });
    </script>
</body>
</html>
