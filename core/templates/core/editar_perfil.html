<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados - SOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .container-form { max-width: 600px; margin: 50px auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        .header-form { background: linear-gradient(135deg, #FF512F 0%, #DD2476 100%); padding: 30px; color: white; text-align: center; }
        .form-body { padding: 40px; }
        .btn-salvar { background: #28a745; color: white; padding: 12px 30px; border: none; border-radius: 50px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-salvar:hover { background: #218838; }
        .btn-cancelar { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container-form">
        <div class="header-form">
            <h2>Meus Dados</h2>
            <p style="opacity: 0.9">Mantenha seu contato atualizado</p>
        </div>

        <div class="form-body">
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn-salvar">SALVAR ALTERAÇÕES</button>
                <a href="{% url 'dashboard' %}" class="btn-cancelar">Voltar ao Painel</a>
            </form>
        </div>
    </div>

</body>
</html>
