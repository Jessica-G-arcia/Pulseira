{% extends "admin/change_form.html" %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
    <style>
        .iti { width: 100%; max-width: 400px; display: block; margin-bottom: 8px; }
        .iti input { visibility: visible !important; width: 100% !important; color: #333 !important; height: 35px; }
        /* Animação suave para o campo aparecer */
        .form-row.field-nome_convenio { transition: all 0.3s ease-in-out; }
    </style>
{% endblock %}

{% block footer %}
    {{ block.super }}
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- 1. CONFIGURAÇÃO DO TELEFONE ---
            const inputTelefone = document.querySelector("#id_responsavel_telefone");
            if (inputTelefone) {
                const iti = window.intlTelInput(inputTelefone, {
                    initialCountry: "br",
                    preferredCountries: ["br", "us", "pt", "es"],
                    separateDialCode: true,
                    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
                });

                // Instrução
                const container = inputTelefone.closest('.iti');
                if(container) {
                    const instrucao = document.createElement("div");
                    instrucao.style.cssText = "color: #d9534f; font-size: 12px; font-weight: bold; margin-top: 5px; margin-bottom: 10px;";
                    instrucao.innerText = "⚠️ Digite o DDD + Número (apenas números).";
                    container.after(instrucao);
                }

                const form = document.querySelector("#pulseira_form");
                if (form) {
                    form.addEventListener("submit", function(e) {
                        if (iti.isValidNumber()) inputTelefone.value = iti.getNumber();
                    });
                }
            }

            // --- 2. CONFIGURAÇÃO DO CONVÊNIO (LÓGICA ROBUSTA) ---
            const selectConvenio = document.getElementById("id_possui_convenio");
            const inputNomeConvenio = document.getElementById("id_nome_convenio");

            if (selectConvenio && inputNomeConvenio) {
                // Truque: Encontra a LINHA INTEIRA (.form-row) onde o campo está
                // Isso funciona melhor do que tentar adivinhar a classe
                const rowNomeConvenio = inputNomeConvenio.closest('.form-row');

                function toggleConvenio() {
                    if (selectConvenio.value === 'S') {
                        rowNomeConvenio.style.display = "block"; // Mostra
                    } else {
                        rowNomeConvenio.style.display = "none";  // Esconde
                        inputNomeConvenio.value = ""; // Limpa se esconder
                    }
                }

                // Roda agora (carregamento)
                toggleConvenio();
                // Roda quando mudar
                selectConvenio.addEventListener("change", toggleConvenio);
            }
        });
    </script>
{% endblock %}
