{% extends "admin/change_form.html" %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
    
    <style>
        .iti { width: 100%; max-width: 400px; display: block; margin-bottom: 8px; }
        .iti input { visibility: visible !important; width: 100% !important; color: #333 !important; height: 35px; }
    </style>
{% endblock %}

{% block footer %}
    {{ block.super }}
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- PARTE 1: TELEFONE ---
            const inputTelefone = document.querySelector("#id_responsavel_telefone");
            if (inputTelefone) {
                const iti = window.intlTelInput(inputTelefone, {
                    initialCountry: "br",
                    preferredCountries: ["br", "us", "pt", "es"],
                    separateDialCode: true,
                    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
                });

                // Instrução visual
                const instrucao = document.createElement("div");
                instrucao.style.cssText = "color: #d9534f; font-size: 12px; font-weight: bold; margin-top: -5px; margin-bottom: 10px;";
                instrucao.innerText = "⚠️ Digite o DDD + Número (apenas números). Ex: 11999990000";
                inputTelefone.closest('.iti').after(instrucao);

                // Salvar corretamente
                const form = document.querySelector("#pulseira_form");
                if (form) {
                    form.addEventListener("submit", function(e) {
                        if (iti.isValidNumber()) {
                            inputTelefone.value = iti.getNumber();
                        }
                    });
                }
            }

            // --- PARTE 2: CONVÊNIO (Abre e Fecha) ---
            const selectConvenio = document.querySelector("#id_possui_convenio");
            // O Django envolve o campo em uma div com a classe 'field-nome_do_campo'
            const divNomeConvenio = document.querySelector(".field-nome_convenio");

            function atualizarConvenio() {
                if (selectConvenio && divNomeConvenio) {
                    if (selectConvenio.value === 'S') {
                        // Se SIM, mostra o campo de nome (efeito slide simples)
                        divNomeConvenio.style.display = "block";
                    } else {
                        // Se NÃO, esconde
                        divNomeConvenio.style.display = "none";
                        // Opcional: Limpar o campo para não salvar lixo
                        document.querySelector("#id_nome_convenio").value = ""; 
                    }
                }
            }

            if (selectConvenio) {
                // Roda ao carregar a página (para editar pulseiras já salvas)
                atualizarConvenio();
                // Roda sempre que mudar a opção
                selectConvenio.addEventListener("change", atualizarConvenio);
            }
        });
    </script>
{% endblock %}
